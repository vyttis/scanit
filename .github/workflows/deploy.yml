name: Deploy scanit.lt to Production

on:
  workflow_dispatch:

# Tokens are read from GitHub repository secrets:
#   SUPABASE_ACCESS_TOKEN — your Supabase personal access token
#   VERCEL_TOKEN           — your Vercel personal access token
#
# Set these at: https://github.com/vyttis/scanit/settings/secrets/actions
# Then run this workflow from: https://github.com/vyttis/scanit/actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CLIs
        run: |
          npm install -g supabase@latest vercel@latest

      # ── Step 1: Create Supabase project ──
      - name: Get Supabase org ID
        id: supabase_org
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ORG_ID=$(supabase orgs list --output json | python3 -c "import sys,json; orgs=json.load(sys.stdin); print(orgs[0]['id'])")
          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "Supabase org: $ORG_ID"

      - name: Create or find Supabase project
        id: supabase_project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          EXISTING=$(supabase projects list --output json | python3 -c "
          import sys,json
          projects = json.load(sys.stdin)
          for p in projects:
              if p['name'] == 'scanit-lt':
                  print(p['id'])
                  break
          " 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "ref=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Project already exists: $EXISTING"
          else
            DB_PASS=$(openssl rand -base64 32 | tr -d '/+=' | head -c 24)
            echo "::add-mask::$DB_PASS"

            REF=$(supabase projects create scanit-lt \
              --org-id "${{ steps.supabase_org.outputs.org_id }}" \
              --db-password "$DB_PASS" \
              --region eu-central-1 \
              --output json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "db_password=$DB_PASS" >> "$GITHUB_OUTPUT"
            echo "Created project: $REF — DB password saved in workflow output (masked)"
          fi

      - name: Wait for project to be ready
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="${{ steps.supabase_project.outputs.ref }}"
          for i in $(seq 1 30); do
            STATUS=$(supabase projects list --output json | python3 -c "
          import sys,json
          for p in json.load(sys.stdin):
              if p['id'] == '$REF':
                  print(p.get('status', 'UNKNOWN'))
                  break
          " 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i/30 — Status: $STATUS"
            if [ "$STATUS" = "ACTIVE_HEALTHY" ]; then exit 0; fi
            sleep 10
          done
          echo "WARNING: Project may not be fully ready, continuing..."

      # ── Step 2: Run migrations ──
      - name: Run database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ steps.supabase_project.outputs.ref }}"
          supabase db push --linked
          echo "Migrations 001 + 002 applied."

      # ── Step 3: Create storage bucket ──
      - name: Get Supabase API keys
        id: keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF="${{ steps.supabase_project.outputs.ref }}"
          KEYS=$(supabase projects api-keys --project-ref "$REF" --output json)

          URL="https://${REF}.supabase.co"
          ANON=$(echo "$KEYS" | python3 -c "import sys,json; print([k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'][0])")
          SVC=$(echo "$KEYS" | python3 -c "import sys,json; print([k['api_key'] for k in json.load(sys.stdin) if k['name']=='service_role'][0])")

          echo "::add-mask::$ANON"
          echo "::add-mask::$SVC"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "anon=$ANON" >> "$GITHUB_OUTPUT"
          echo "svc=$SVC" >> "$GITHUB_OUTPUT"
          echo "Supabase URL: $URL"

      - name: Create private reports bucket
        run: |
          curl -sf -X POST "${{ steps.keys.outputs.url }}/storage/v1/bucket" \
            -H "Authorization: Bearer ${{ steps.keys.outputs.svc }}" \
            -H "apikey: ${{ steps.keys.outputs.svc }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"reports","name":"reports","public":false}' \
            && echo "Bucket created." \
            || echo "Bucket may already exist (OK)."

      # ── Step 4: Deploy to Vercel ──
      - name: Link Vercel project
        run: vercel link --yes --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Set Vercel env vars
        run: |
          SECRET=$(openssl rand -base64 32)
          echo "${{ steps.keys.outputs.url }}"   | vercel env add NEXT_PUBLIC_SUPABASE_URL production --token "${{ secrets.VERCEL_TOKEN }}" --force 2>/dev/null || true
          echo "${{ steps.keys.outputs.anon }}"   | vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY production --token "${{ secrets.VERCEL_TOKEN }}" --force 2>/dev/null || true
          echo "${{ steps.keys.outputs.svc }}"    | vercel env add SUPABASE_SERVICE_ROLE_KEY production --token "${{ secrets.VERCEL_TOKEN }}" --force 2>/dev/null || true
          echo "$SECRET"                           | vercel env add NEXTAUTH_SECRET production --token "${{ secrets.VERCEL_TOKEN }}" --force 2>/dev/null || true
          echo "https://platform.scanit.lt"        | vercel env add NEXT_PUBLIC_APP_URL production --token "${{ secrets.VERCEL_TOKEN }}" --force 2>/dev/null || true
          echo "Vercel env vars configured."

      - name: Deploy to production
        id: deploy
        run: |
          URL=$(vercel --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | tail -1)
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Summary
        run: |
          echo "## scanit.lt Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel | ${{ steps.deploy.outputs.deploy_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase | ${{ steps.keys.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Add custom domain \`platform.scanit.lt\` in Vercel dashboard" >> $GITHUB_STEP_SUMMARY
          echo "2. Add scan API keys (SHODAN, HIBP, etc.) in Vercel env vars" >> $GITHUB_STEP_SUMMARY
          echo "3. Add \`ANTHROPIC_API_KEY\` in Vercel env vars" >> $GITHUB_STEP_SUMMARY
          echo "4. Enable MFA enforcement in Supabase Auth settings" >> $GITHUB_STEP_SUMMARY
